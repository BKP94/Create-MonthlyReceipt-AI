<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — ให้หน้าเว็บกินพื้นที่ใต้ notch ได้
         (คู่กับ env(safe-area-inset-*) ใน Layout.jsx) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>โปรแกรมบริหารการเงินส่วนตัว</title>

    <!-- สีแถบสถานะบนมือถือ -->
    <meta name="theme-color" content="#1565C0" />
    <meta name="description" content="บันทึกรายจ่ายรายเดือน ผ่อนชำระ งบประมาณ และประวัติเงินเดือน" />

    <!-- iOS: เปิดจากไอคอนหน้าจอโฮมแบบเต็มจอ ไม่มีแถบ URL -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="บริหารการเงิน" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
