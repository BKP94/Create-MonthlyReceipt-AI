<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — ให้หน้าเว็บกินพื้นที่ใต้ notch ได้
         (คู่กับ env(safe-area-inset-*) ใน Layout.jsx) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>โปรแกรมบริหารการเงินส่วนตัว</title>

    <!-- สีแถบสถานะบนมือถือ -->
    <meta name="theme-color" content="#F9F5EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="บันทึกรายจ่ายรายเดือน ผ่อนชำระ งบประมาณ และประวัติเงินเดือน" />

    <!-- iOS: เปิดจากไอคอนหน้าจอโฮมแบบเต็มจอ ไม่มีแถบ URL -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="บริหารการเงิน" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- favicon บนแท็บ — svg สำหรับเบราว์เซอร์ใหม่, png 32px สำรอง -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
